name: SmartRecruiters Provider Benchmark

on:
  push:
    branches:
      - feat/smartrecruiters-tier-a
    paths:
      - ".github/smartrecruiters-benchmark-run.json"
      - ".github/smartrecruiters-capacity-run.json"
      - ".github/workflows/smartrecruiters-provider-benchmark.yml"
      - "job_scout/collectors/smartrecruiters.py"
      - "validation/smartrecruiters_provider_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobsift-smartrecruiters-provider-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - name: Run bounded SmartRecruiters benchmark
        run: |
          mkdir -p benchmark-result
          python -m validation.smartrecruiters_provider_v1.run \
            --config .github/smartrecruiters-benchmark-run.json \
            --brief config/search_briefs/taiwo_software_remote_us_v1.json \
            --output benchmark-result/report.json

      - name: Validate provider health gate
        run: |
          python - <<'PY'
          import json
          report = json.load(open("benchmark-result/report.json"))
          from validation.smartrecruiters_provider_v1.run import validate_benchmark_report
          validate_benchmark_report(report, require_nonempty=True)
          print(json.dumps(report["totals"], sort_keys=True))
          PY

      - name: Measure bounded client-relevant supply
        run: |
          python -m validation.smartrecruiters_provider_v1.run \
            --config .github/smartrecruiters-capacity-run.json \
            --brief config/search_briefs/taiwo_software_remote_us_v1.json \
            --output benchmark-result/capacity-report.json

      - name: Validate capacity evidence gate
        run: |
          python - <<'PY'
          import json
          from validation.smartrecruiters_provider_v1.run import validate_benchmark_report
          report = json.load(open("benchmark-result/capacity-report.json"))
          validate_benchmark_report(report)
          print(json.dumps(report["totals"], sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobsift-smartrecruiters-provider-${{ github.run_id }}
          path: benchmark-result/
          if-no-files-found: warn
          retention-days: 7
