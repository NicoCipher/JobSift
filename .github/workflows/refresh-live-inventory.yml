name: Refresh Live Job Inventory

on:
  workflow_dispatch:
    inputs:
      workday_targets:
        description: "Guarded Workday targets per hourly refresh (1, 5, 10, 20, or 25)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "20"
          - "25"
      workday_detail_concurrency:
        description: "Guarded concurrent Workday detail reads per target"
        required: false
        default: "4"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
  schedule:
    # GitHub scheduled workflows are best-effort. Four staggered trigger
    # opportunities per hour let the persistent logical scheduler recover
    # delayed/dropped events without processing an hour twice.
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

concurrency:
  group: jobsift-live-inventory-refresh
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      JOBSIFT_DATABASE: /tmp/jobsift-plan.sqlite3
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_run: ${{ steps.matrix.outputs.should_run }}
      cohort: ${{ steps.schedule.outputs.cohort }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e '.[cloud]'

      - name: Resolve logical refresh cohort
        id: schedule
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL secret"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN secret"; exit 1; }
          mkdir -p refresh-plan
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m job_scout.inventory_refresh schedule-next \
              --database "$JOBSIFT_DATABASE" \
              --output refresh-plan/schedule.json
            should_run="$(python -c 'import json; print(str(json.load(open("refresh-plan/schedule.json"))["should_run"]).lower())')"
            cohort="$(python -c 'import json; v=json.load(open("refresh-plan/schedule.json"))["cohort"]; print("" if v is None else v)')"
          else
            should_run=true
            cohort=$(( $(date -u +%s) / 3600 ))
            python -c 'import json,sys; json.dump({"should_run": True, "cohort": int(sys.argv[1]), "trigger": "workflow_dispatch"}, open("refresh-plan/schedule.json","w"), indent=2)' "$cohort"
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "cohort=$cohort" >> "$GITHUB_OUTPUT"

      - name: Build rotating refresh cohort
        if: ${{ steps.schedule.outputs.should_run == 'true' }}
        env:
          # Scheduled production is promoted to 25 after the successful guarded
          # index-first Workday run at 25. Manual dispatch remains available for staged tests.
          WORKDAY_TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.workday_targets || '25' }}
          WORKDAY_DETAIL_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.workday_detail_concurrency || '4' }}
          LOGICAL_COHORT: ${{ steps.schedule.outputs.cohort }}
        run: |
          python -m job_scout.inventory_refresh plan \
            --registry config/source_registries/production_active_v1.json \
            --database "$JOBSIFT_DATABASE" \
            --plan-dir config/sourcing_plans \
            --repo-root . \
            --cohort "$LOGICAL_COHORT" \
            --workday-limit "$WORKDAY_TARGETS" \
            --workday-detail-concurrency "$WORKDAY_DETAIL_CONCURRENCY" \
            --output-dir refresh-plan

      - name: Export worker matrix
        id: matrix
        run: |
          if [ "${{ steps.schedule.outputs.should_run }}" = "true" ]; then
            matrix="$(python -c 'import json; print(json.dumps(json.load(open("refresh-plan/matrix.json")), separators=(",", ":")))' )"
          else
            matrix='{"include":[]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "should_run=${{ steps.schedule.outputs.should_run }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-refresh-plan-${{ github.run_id }}
          path: refresh-plan/
          if-no-files-found: error
          retention-days: 2

  collect:
    if: ${{ needs.plan.outputs.should_run == 'true' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-refresh-plan-${{ github.run_id }}
          path: refresh-plan

      - name: Collect ${{ matrix.shard_id }}
        run: |
          mkdir -p shard-output
          python -m job_scout.inventory_refresh collect \
            --registry refresh-plan/registry.json \
            --manifest refresh-plan/manifest.json \
            --refresh-plan refresh-plan/plan.json \
            --shard-id "${{ matrix.shard_id }}" \
            --repo-root . \
            --output "shard-output/${{ matrix.shard_id }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-refresh-shard-${{ matrix.shard_id }}-${{ github.run_id }}
          path: shard-output/${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 2

  persist-and-deliver:
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.should_run == 'true' }}
    concurrency:
      group: jobsift-client-delivery-mutation
      queue: max
      cancel-in-progress: false
    needs:
      - plan
      - collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBSIFT_DATABASE: /tmp/jobsift.sqlite3
      JOBSIFT_PLAN_DIR: config/sourcing_plans
      JOBSIFT_REPORTS_DIR: /tmp/jobsift-runs
      JOBSIFT_INVENTORY_RETENTION_HOURS: "72"
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e '.[sheets,cloud]'

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-refresh-plan-${{ github.run_id }}
          path: refresh-plan

      - uses: actions/download-artifact@v4
        with:
          pattern: jobsift-refresh-shard-*-${{ github.run_id }}
          path: shard-artifacts
          merge-multiple: true

      - name: Validate persistent runtime
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL secret"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN secret"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }

      - name: Verify active profile snapshot
        run: |
          python -m job_scout.inventory_refresh verify-profile-snapshot \
            --refresh-plan refresh-plan/plan.json \
            --database "$JOBSIFT_DATABASE" \
            --plan-dir "$JOBSIFT_PLAN_DIR" \
            --repo-root .

      - name: Persist shared inventory
        run: |
          mkdir -p refresh-result
          python -m job_scout.inventory_refresh fan-in \
            --registry refresh-plan/registry.json \
            --parent-registry refresh-plan/parent-registry.json \
            --manifest refresh-plan/manifest.json \
            --refresh-plan refresh-plan/plan.json \
            --artifacts-dir shard-artifacts \
            --database "$JOBSIFT_DATABASE" \
            --retention-hours "$JOBSIFT_INVENTORY_RETENTION_HOURS" \
            --skip-retention \
            --output refresh-result/report.json

      - name: Configure Google credentials
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-service-account.json" >> "$GITHUB_ENV"

      - name: Deliver to active client profiles
        run: python -m job_scout.profile_delivery_runner

      - name: Mark scheduled cohort complete
        if: ${{ github.event_name == 'schedule' }}
        run: |
          python -m job_scout.inventory_refresh schedule-complete \
            --database "$JOBSIFT_DATABASE" \
            --cohort "${{ needs.plan.outputs.cohort }}" \
            --fan-in-report refresh-result/report.json \
            --output refresh-result/schedule-complete.json

      # Retention cleanup is housekeeping, not part of logical cohort completion.
      # A cleanup failure is surfaced by this run and retried on a later mutation run
      # without replaying an already-completed logical cohort.
      - name: Prune stale inventory
        if: ${{ always() }}
        run: |
          python -m job_scout.inventory_refresh prune \
            --database "$JOBSIFT_DATABASE" \
            --retention-hours "$JOBSIFT_INVENTORY_RETENTION_HOURS" \
            --output refresh-result/retention.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobsift-refresh-result-${{ github.run_id }}
          path: refresh-result/
          if-no-files-found: warn
          retention-days: 7
