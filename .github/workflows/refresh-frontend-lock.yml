name: Refresh JobSift frontend lockfile

on:
  push:
    branches:
      - fix/client-onboarding-48h-policy
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

# This one-time branch-scoped workflow is removed after lockfile generation.

concurrency:
  group: jobsift-frontend-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-onboarding-48h-policy
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Update frontend lockfile for libsodium"
          git push origin HEAD:fix/client-onboarding-48h-policy
