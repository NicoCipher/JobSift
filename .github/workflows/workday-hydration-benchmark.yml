name: JOB-37 Workday Hydration Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feat/job-37-workday-hydration-yield
    paths:
      - ".github/job37-run.json"

permissions:
  contents: read

concurrency:
  group: jobsift-job37-workday-hydration
  cancel-in-progress: false

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - name: Run trusted Workday hydration yield
        run: |
          mkdir -p job37-result
          python -m job_scout.workday_hydration_benchmark \
            --registry config/source_registries/production_active_v1.json \
            --candidates validation/workday_hydration_v1/candidates_run_36825761076.json.gz \
            --brief config/search_briefs/taiwo_software_remote_us_v1.json \
            --database job37-result/jobs.sqlite3 \
            --output job37-result/report.json \
            --detail-concurrency 4 \
            --expected-candidates 140

      - name: Publish JOB-37 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobsift-job37-workday-hydration-${{ github.run_id }}
          path: job37-result/
          if-no-files-found: warn
          retention-days: 7
