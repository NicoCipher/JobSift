name: Bounded Source Benchmark

on:
  push:
    branches:
      - benchmark/bounded-run
    paths:
      - ".github/benchmark-run.json"
  workflow_dispatch:
    inputs:
      greenhouse_targets:
        description: Production-approved Greenhouse targets to sample
        required: true
        default: 10
        type: number
      ashby_targets:
        description: Production-approved Ashby targets to sample
        required: true
        default: 10
        type: number
      workday_targets:
        description: Production-approved Workday targets to sample
        required: true
        default: 5
        type: number
      lever_targets:
        description: Production-approved Lever targets to sample
        required: true
        default: 10
        type: number
      greenhouse_shards:
        description: Greenhouse worker shards
        required: true
        default: 2
        type: number
      ashby_shards:
        description: Ashby worker shards
        required: true
        default: 2
        type: number
      workday_shards:
        description: Workday worker shards
        required: true
        default: 2
        type: number
      lever_shards:
        description: Lever worker shards
        required: true
        default: 2
        type: number
      workday_detail_concurrency:
        description: Bounded concurrent Workday detail reads per target
        required: true
        default: 4
        type: number

permissions:
  contents: read

concurrency:
  group: jobsift-bounded-source-benchmark
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - name: Build bounded benchmark plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GREENHOUSE_TARGETS: ${{ github.event.inputs.greenhouse_targets }}
          ASHBY_TARGETS: ${{ github.event.inputs.ashby_targets }}
          WORKDAY_TARGETS: ${{ github.event.inputs.workday_targets }}
          LEVER_TARGETS: ${{ github.event.inputs.lever_targets }}
          GREENHOUSE_SHARDS: ${{ github.event.inputs.greenhouse_shards }}
          ASHBY_SHARDS: ${{ github.event.inputs.ashby_shards }}
          WORKDAY_SHARDS: ${{ github.event.inputs.workday_shards }}
          LEVER_SHARDS: ${{ github.event.inputs.lever_shards }}
          WORKDAY_DETAIL_CONCURRENCY: ${{ github.event.inputs.workday_detail_concurrency }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            GREENHOUSE_TARGETS=10
            ASHBY_TARGETS=10
            WORKDAY_TARGETS=5
            LEVER_TARGETS=10
            GREENHOUSE_SHARDS=2
            ASHBY_SHARDS=2
            WORKDAY_SHARDS=2
            LEVER_SHARDS=2
            WORKDAY_DETAIL_CONCURRENCY=4
          fi
          python -m job_scout.shard_benchmark plan \
            --registry config/source_registries/production_active_v1.json \
            --output-dir benchmark-plan \
            --limit "greenhouse=$GREENHOUSE_TARGETS" \
            --limit "ashby=$ASHBY_TARGETS" \
            --limit "workday=$WORKDAY_TARGETS" \
            --limit "lever=$LEVER_TARGETS" \
            --shards "greenhouse=$GREENHOUSE_SHARDS" \
            --shards "ashby=$ASHBY_SHARDS" \
            --shards "workday=$WORKDAY_SHARDS" \
            --shards "lever=$LEVER_SHARDS" \
            --workday-detail-concurrency "$WORKDAY_DETAIL_CONCURRENCY"

      - name: Export worker matrix
        id: matrix
        run: |
          matrix="$(python -c 'import json; print(json.dumps(json.load(open("benchmark-plan/matrix.json")), separators=(",", ":")))' )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-benchmark-plan-${{ github.run_id }}
          path: benchmark-plan/
          if-no-files-found: error
          retention-days: 3

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-benchmark-plan-${{ github.run_id }}
          path: benchmark-plan

      - name: Collect ${{ matrix.shard_id }}
        run: |
          mkdir -p shard-output
          python -m job_scout.shard_benchmark collect \
            --registry benchmark-plan/registry.json \
            --manifest benchmark-plan/manifest.json \
            --benchmark-plan benchmark-plan/plan.json \
            --shard-id "${{ matrix.shard_id }}" \
            --output "shard-output/${{ matrix.shard_id }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-benchmark-shard-${{ matrix.shard_id }}-${{ github.run_id }}
          path: shard-output/${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 3

  fan-in:
    if: ${{ always() && needs.plan.result == 'success' }}
    env:
      TURSO_DATABASE_URL: ""
      TURSO_AUTH_TOKEN: ""
    needs:
      - plan
      - collect
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-benchmark-plan-${{ github.run_id }}
          path: benchmark-plan

      - uses: actions/download-artifact@v4
        with:
          pattern: jobsift-benchmark-shard-*-${{ github.run_id }}
          path: shard-artifacts
          merge-multiple: true

      - name: Validate, persist locally, and evaluate
        run: |
          mkdir -p benchmark-result
          python -m job_scout.shard_benchmark fan-in \
            --registry benchmark-plan/registry.json \
            --manifest benchmark-plan/manifest.json \
            --artifacts-dir shard-artifacts \
            --database benchmark-result/jobs.sqlite3 \
            --brief config/search_briefs/taiwo_software_remote_us_v1.json \
            --output benchmark-result/report.json

      - name: Publish benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobsift-benchmark-result-${{ github.run_id }}
          path: benchmark-result/
          if-no-files-found: warn
          retention-days: 7
