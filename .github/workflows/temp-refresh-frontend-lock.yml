name: Temporary frontend lockfile security refresh

on:
  push:
    branches:
      - fix/client-onboarding-48h-policy

permissions:
  contents: write

concurrency:
  group: jobsift-frontend-lock-security-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-onboarding-48h-policy
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update and audit lockfile
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Update vulnerable frontend dependencies"
          git fetch origin fix/client-onboarding-48h-policy
          git rebase origin/fix/client-onboarding-48h-policy
          git push origin HEAD:fix/client-onboarding-48h-policy

# Remove after this one-time dependency refresh.