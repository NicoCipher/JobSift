name: Client Delivery Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Control action
        required: true
        type: choice
        default: status
        options:
          - status
          - list
          - pause
          - resume
          - sheet-check
          - sheet-disable
          - sheet-enable
          - set-quota
          - set-mode
          - set-timezone
          - run-now
          - release-batch
          - release-selection
          - discard-batch
      profile_id:
        description: Opaque delivery profile ID shown by profile setup/status
        required: false
        type: string
      daily_quota:
        description: New daily quota for Set quota
        required: false
        default: "100"
        type: string
      delivery_mode:
        description: New delivery mode for Set mode
        required: false
        default: review
        type: choice
        options:
          - review
          - auto
      timezone:
        description: IANA timezone for Set timezone
        required: false
        default: Africa/Lagos
        type: string
      batch_id:
        description: Prepared batch ID for release/discard
        required: false
        type: string
      removed_ordinals:
        description: Comma-separated reviewed rows to exclude before release
        required: false
        type: string
      expected_generation_id:
        description: Opaque reviewed batch revision for release-selection
        required: false
        type: string
      control_request_id:
        description: Opaque correlation ID from the operator interface
        required: false
        type: string

permissions:
  contents: read

# Run-now consumes a cached inventory snapshot: serialize with every inventory
# writer. Other profile operations retain the shorter delivery-mutation queue.
concurrency:
  group: ${{ inputs.operation == 'run-now' && 'jobsift-live-inventory-refresh' || 'jobsift-client-delivery-mutation' }}
  queue: max
  cancel-in-progress: false

jobs:
  control:
    # For run-now acquire the delivery mutation lock AFTER the inventory lock,
    # matching refresh's lock order. Other operations already own delivery at
    # workflow level, so use a unique harmless job group to avoid self-deadlock.
    concurrency:
      group: ${{ inputs.operation == 'run-now' && 'jobsift-client-delivery-mutation' || format('jobsift-control-job-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      JOBSIFT_DATABASE: /tmp/jobsift.sqlite3
      JOBSIFT_PLAN_DIR: config/sourcing_plans
      JOBSIFT_REPORTS_DIR: /tmp/jobsift-runs
      JOBSIFT_INVENTORY_RETENTION_HOURS: "72"
      JOBSIFT_PERSISTENCE_BACKEND: postgres
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      JOBSIFT_CONTROL_REQUEST_ID: ${{ inputs.control_request_id }}
      JOBSIFT_PROVISIONING_KEY: ${{ secrets.JOBSIFT_PROVISIONING_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e '.[sheets,postgres]'

      - name: Validate persistent runtime
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }

      - name: Configure Google credentials
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-service-account.json" >> "$GITHUB_ENV"

      - name: Apply control
        shell: bash
        env:
          CONTROL_OPERATION: ${{ inputs.operation }}
          CONTROL_PROFILE_ID: ${{ inputs.profile_id }}
          CONTROL_DAILY_QUOTA: ${{ inputs.daily_quota }}
          CONTROL_DELIVERY_MODE: ${{ inputs.delivery_mode }}
          CONTROL_TIMEZONE: ${{ inputs.timezone }}
          CONTROL_BATCH_ID: ${{ inputs.batch_id }}
          CONTROL_REMOVED_ORDINALS: ${{ inputs.removed_ordinals }}
          CONTROL_EXPECTED_GENERATION_ID: ${{ inputs.expected_generation_id }}
        run: |
          operation="$CONTROL_OPERATION"
          profile_id="$CONTROL_PROFILE_ID"
          case "$operation" in
            list)
              python -m job_scout.cli delivery-profile list \
                --database "$JOBSIFT_DATABASE"
              ;;
            status)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile status \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --reconcile
              ;;
            pause|resume)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile "$operation" \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id"
              ;;
            sheet-check|sheet-disable|sheet-enable)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile "$operation" \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id"
              ;;
            set-quota)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile set-quota \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --daily-quota "$CONTROL_DAILY_QUOTA"
              ;;
            set-mode)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile set-mode \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --delivery-mode "$CONTROL_DELIVERY_MODE"
              ;;
            set-timezone)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile set-timezone \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --timezone "$CONTROL_TIMEZONE"
              ;;
            run-now)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              JOBSIFT_PROFILE_CONTROL_ID="$profile_id" \
                python -m job_scout.profile_delivery_runner
              ;;
            release-batch)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              test -n "$CONTROL_BATCH_ID" || { echo "batch_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile release-batch \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --batch-id "$CONTROL_BATCH_ID" \
                --confirm-batch-id "$CONTROL_BATCH_ID"
              ;;
            release-selection)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              test -n "$CONTROL_BATCH_ID" || { echo "batch_id is required"; exit 1; }
              test -n "$CONTROL_EXPECTED_GENERATION_ID" || { echo "expected_generation_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile release-selection \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --batch-id "$CONTROL_BATCH_ID" \
                --expected-generation-id "$CONTROL_EXPECTED_GENERATION_ID" \
                --removed-ordinals "$CONTROL_REMOVED_ORDINALS" \
                --confirm-batch-id "$CONTROL_BATCH_ID"
              ;;
            discard-batch)
              test -n "$profile_id" || { echo "profile_id is required"; exit 1; }
              test -n "$CONTROL_BATCH_ID" || { echo "batch_id is required"; exit 1; }
              python -m job_scout.cli delivery-profile discard-batch \
                --database "$JOBSIFT_DATABASE" \
                --profile-id "$profile_id" \
                --batch-id "$CONTROL_BATCH_ID"
              ;;
          esac

      - name: Emit authoritative operator state
        if: ${{ always() }}
        run: python -m job_scout.operator_snapshot
