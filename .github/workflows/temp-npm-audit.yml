name: Temporary JobSift frontend dependency audit

on:
  push:
    branches:
      - fix/client-onboarding-48h-policy

permissions:
  contents: read

concurrency:
  group: jobsift-onboarding-validation
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint, build and browser tests
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          console.log(JSON.stringify({metadata: audit.metadata?.vulnerabilities, vulnerabilities: Object.keys(audit.vulnerabilities || {})}, null, 2));
          NODE
