name: Live JobSift

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release the currently prepared batch to Google Sheets
        required: true
        default: false
        type: boolean
      discard:
        description: Discard the unreleased prepared batch without publishing it
        required: true
        default: false
        type: boolean
      validate:
        description: Run isolated sourcing validation only; never touch Turso or Sheets
        required: true
        default: false
        type: boolean
      quota:
        description: Maximum links to prepare when there is no unresolved batch
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "25"
          - "50"
          - "100"
          - "150"
          - "200"
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: jobsift-live-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBSIFT_PLAN: config/sourcing_plans/taiwo_software_remote_us_v2.json
      JOBSIFT_DATABASE: /tmp/jobsift.sqlite3
      JOBSIFT_CSV: /tmp/latest-sourcing.csv
      JOBSIFT_REPORTS_DIR: /tmp/jobsift-runs
      JOBSIFT_TIMEZONE: Africa/Lagos
      JOBSIFT_ALLOW_PARTIAL: "false"
      JOBSIFT_RUN_ONCE: "true"
      JOBSIFT_INVENTORY_RETENTION_HOURS: "72"
      JOBSIFT_DESTINATION_ID: ${{ vars.JOBSIFT_DESTINATION_ID }}
      JOBSIFT_SHEET_ID: ${{ vars.JOBSIFT_SHEET_ID }}
      JOBSIFT_SHEET_TAB: ${{ vars.JOBSIFT_SHEET_TAB }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sheets,cloud]'

      - name: Validate runtime configuration
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.validate }}" != "true" ]]; then
            test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL secret"; exit 1; }
            test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN secret"; exit 1; }
          fi

      - name: Configure run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.release }}" == "true" && "${{ inputs.discard }}" == "true" ]]; then
              echo "release and discard cannot both be true"
              exit 1
            fi
            if [[ "${{ inputs.validate }}" == "true" && ( "${{ inputs.release }}" == "true" || "${{ inputs.discard }}" == "true" ) ]]; then
              echo "validation cannot be combined with release or discard"
              exit 1
            fi
            echo "JOBSIFT_AUTO_RELEASE=${{ inputs.release }}" >> "$GITHUB_ENV"
            echo "JOBSIFT_DISCARD_PREPARED=${{ inputs.discard }}" >> "$GITHUB_ENV"
            echo "JOBSIFT_VALIDATION_ONLY=${{ inputs.validate }}" >> "$GITHUB_ENV"
            echo "JOBSIFT_BATCH_QUOTA=${{ inputs.quota }}" >> "$GITHUB_ENV"
            if [[ "${{ inputs.validate }}" == "true" ]]; then
              echo "JOBSIFT_DATABASE=/tmp/jobsift-validation.sqlite3" >> "$GITHUB_ENV"
              echo "TURSO_DATABASE_URL=" >> "$GITHUB_ENV"
              echo "TURSO_AUTH_TOKEN=" >> "$GITHUB_ENV"
            fi
          else
            echo "JOBSIFT_AUTO_RELEASE=false" >> "$GITHUB_ENV"
            echo "JOBSIFT_DISCARD_PREPARED=false" >> "$GITHUB_ENV"
            echo "JOBSIFT_VALIDATION_ONLY=false" >> "$GITHUB_ENV"
            echo "JOBSIFT_BATCH_QUOTA=5" >> "$GITHUB_ENV"
          fi

      - name: Write Google service account credentials
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"

      - name: Run JobSift
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
        run: python -m job_scout.live_runner
