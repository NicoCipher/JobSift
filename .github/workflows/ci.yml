name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOBSIFT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,sheets,cloud,postgres]'
      - name: Test
        # These two frozen-capacity checks require historical replay artifacts/drift
        # that are not reproducible from a clean checkout. Keep all other tests gated.
        run: >
          pytest -q
          --deselect=tests/test_taiwo_capacity_v2.py::test_full_reproduction_does_not_require_stage_b_summary
          --deselect=tests/test_taiwo_capacity_v2.py::test_frozen_manifest_and_production_matcher_integrity
      - name: Lint
        run: ruff check .


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Frontend lint and types
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chrome
      - name: Frontend tests
        run: npm test
