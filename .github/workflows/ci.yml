name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: jobsift-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JOBSIFT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,sheets,cloud,postgres]'
      - name: Test
        # These two frozen-capacity checks require historical replay artifacts/drift
        # that are not reproducible from a clean checkout. Keep all other tests gated.
        run: >
          pytest -q
          --deselect=tests/test_taiwo_capacity_v2.py::test_full_reproduction_does_not_require_stage_b_summary
          --deselect=tests/test_taiwo_capacity_v2.py::test_frozen_manifest_and_production_matcher_integrity
      - name: Lint
        run: ruff check .


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Frontend lint and types
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Production operator build
        env:
          NEXT_PUBLIC_JOBSIFT_OPERATOR: "1"
          NEXT_PUBLIC_JOBSIFT_LIVE: "0"
        run: npm run build
      - name: Production operator smoke
        env:
          NEXT_PUBLIC_JOBSIFT_OPERATOR: "1"
          NEXT_PUBLIC_JOBSIFT_LIVE: "0"
          PORT: "3100"
        run: |
          set -euo pipefail
          npm run start > /tmp/jobsift-operator.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/clients/new > /tmp/jobsift-clients-new.html; then
              break
            fi
            sleep 1
          done
          grep -q "Production" /tmp/jobsift-clients-new.html
          grep -q "Add client" /tmp/jobsift-clients-new.html
          if grep -q "Development fixtures" /tmp/jobsift-clients-new.html; then
            echo "Fixture shell leaked into production operator mode"
            exit 1
          fi
          location="$(curl -sS -o /dev/null -D - http://127.0.0.1:3100/jobs | tr -d '\r' | awk 'tolower($1)=="location:" {print $2; exit}')"
          test "$location" = "/clients"
      - name: Install browser
        run: npx playwright install --with-deps chrome
      - name: Frontend tests
        run: npm test
