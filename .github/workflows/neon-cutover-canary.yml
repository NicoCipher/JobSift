name: Neon Cutover Canary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/neon-cutover-canary.yml"

permissions:
  contents: read

concurrency:
  group: jobsift-neon-cutover-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBSIFT_DATABASE: /tmp/jobsift-canary.sqlite3
      JOBSIFT_PERSISTENCE_BACKEND: postgres
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate Neon secret
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }

      - name: Install Postgres runtime
        run: python -m pip install -e '.[postgres]'

      - name: Exercise migrated production repository
        env:
          CANARY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime

          from job_scout.storage.factory import create_repository
          from job_scout.storage.inventory_runs import InventoryRunStore
          from job_scout.storage.refresh_schedule import InventoryRefreshScheduleStore

          repository = create_repository(os.environ["JOBSIFT_DATABASE"])
          now = datetime.now(UTC)
          suffix = os.environ["CANARY_RUN_ID"]
          schedule_key = f"neon-cutover-canary-{suffix}"
          run_id = f"neon-cutover-canary-{suffix}"

          schedule = InventoryRefreshScheduleStore(repository, schedule_key=schedule_key)
          due = schedule.next_due(now=now)
          assert due.should_run is True
          assert due.cohort is not None
          assert schedule.mark_completed(cohort=due.cohort, completed_at=now) is True
          assert schedule.next_due(now=now).should_run is False

          runs = InventoryRunStore(repository)
          assert runs.create_if_absent(
              run_id=run_id,
              plan_id="neon-cutover-canary",
              started_at=now,
          ) is True
          assert runs.create_if_absent(
              run_id=run_id,
              plan_id="neon-cutover-canary",
              started_at=now,
          ) is False
          runs.finish(run_id=run_id, status="success", completed_at=now)
          assert runs.get(run_id).status == "success"

          with repository.connect() as connection:
              counts = {
                  "jobs": int(
                      connection.execute("SELECT COUNT(*) AS n FROM jobs").fetchone()["n"]
                  ),
                  "delivery_profiles": int(
                      connection.execute(
                          "SELECT COUNT(*) AS n FROM client_delivery_profiles"
                      ).fetchone()["n"]
                  ),
                  "identity_ledger": int(
                      connection.execute(
                          "SELECT COUNT(*) AS n FROM job_identity_ledger"
                      ).fetchone()["n"]
                  ),
              }
              connection.execute("BEGIN IMMEDIATE")
              connection.execute("DELETE FROM inventory_runs WHERE run_id=?", (run_id,))
              connection.execute(
                  "DELETE FROM inventory_refresh_schedule_state WHERE schedule_key=?",
                  (schedule_key,),
              )

          print(json.dumps({"canary": "passed", "counts": counts}, sort_keys=True))
          PY

      - name: Read migrated client profiles through CLI
        run: python -m job_scout.cli delivery-profile list --database "$JOBSIFT_DATABASE"
