name: Migrate Current Test Sheet Destination

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-current-test-sheet.yml"

permissions:
  contents: read

concurrency:
  group: jobsift-current-sheet-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBSIFT_DATABASE: /tmp/jobsift.sqlite3
      JOBSIFT_SHEET_ID: ${{ vars.JOBSIFT_SHEET_ID }}
      JOBSIFT_SHEET_TAB: ${{ vars.JOBSIFT_SHEET_TAB }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sheets,cloud]'

      - name: Validate migration configuration
        shell: bash
        run: |
          test -n "$JOBSIFT_SHEET_ID" || { echo "Missing JOBSIFT_SHEET_ID"; exit 1; }
          test -n "$JOBSIFT_SHEET_TAB" || { echo "Missing JOBSIFT_SHEET_TAB"; exit 1; }
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Write Google credentials
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"

      - name: Register current test Sheet
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
        shell: bash
        run: |
          job-scout destination register-google-sheet \
            --database "$JOBSIFT_DATABASE" \
            --client "taiwo_operator_sourcing_v1" \
            --destination-id "taiwo-test-jobs" \
            --display-name "Taiwo Test Jobs" \
            --spreadsheet "$JOBSIFT_SHEET_ID" \
            --tab "$JOBSIFT_SHEET_TAB" \
            --mapping-json '{"Job Title":"Job Title","Company Name":"Company Name","Job Link":"Job Link","Job Description":"Job Description","Job Platform":"Job Platform","Status":"Status","Batch ID":"Batch ID","Batch Prepared At":"Batch Prepared At","Job ID":"Job ID"}' \
            > "$RUNNER_TEMP/migration-result.json"
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ["RUNNER_TEMP"] + "/migration-result.json"))
          print(json.dumps({
              "client_id": result["client_id"],
              "destination_id": result["destination_id"],
              "logical_destination": result["logical_destination"],
              "status": result["status"],
          }, sort_keys=True))
          PY
