name: JobSift Database Maintenance

on:
  workflow_dispatch:
  schedule:
    # One small retention pass daily; this does not collect jobs or deliver to clients.
    - cron: "17 13 * * *"

permissions:
  contents: read

concurrency:
  group: jobsift-client-delivery-mutation
  queue: max
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBSIFT_DATABASE: /tmp/jobsift-maintenance.sqlite3
      JOBSIFT_PERSISTENCE_BACKEND: postgres
      JOBSIFT_INVENTORY_RETENTION_HOURS: "72"
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e '.[postgres]'

      - name: Validate persistent runtime
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "Missing NEON_DATABASE_URL secret"; exit 1; }

      - name: Prune expired inventory
        run: |
          mkdir -p maintenance-result
          python -m job_scout.inventory_refresh prune \
            --database "$JOBSIFT_DATABASE" \
            --retention-hours "$JOBSIFT_INVENTORY_RETENTION_HOURS" \
            --output maintenance-result/retention.json
          cat maintenance-result/retention.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobsift-database-maintenance-${{ github.run_id }}
          path: maintenance-result/
          if-no-files-found: warn
          retention-days: 7
