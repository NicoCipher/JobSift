name: Register Client Sheet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobsift-client-sheet-registration
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JOBSIFT_DATABASE: /tmp/jobsift.sqlite3
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      JOBSIFT_CLIENT_SHEET_REGISTRATION_JSON: ${{ secrets.JOBSIFT_CLIENT_SHEET_REGISTRATION_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sheets,cloud]'

      - name: Validate private configuration
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing TURSO_DATABASE_URL secret"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing TURSO_AUTH_TOKEN secret"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$JOBSIFT_CLIENT_SHEET_REGISTRATION_JSON" || {
            echo "Missing JOBSIFT_CLIENT_SHEET_REGISTRATION_JSON secret"
            exit 1
          }

      - name: Write private runtime files
        shell: bash
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-service-account.json"
          chmod 600 "$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$JOBSIFT_CLIENT_SHEET_REGISTRATION_JSON" > "$RUNNER_TEMP/client-sheet-registration.json"
          chmod 600 "$RUNNER_TEMP/client-sheet-registration.json"

      - name: Register client destination
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-service-account.json
        shell: bash
        run: |
          job-scout destination register-google-sheet-file \
            --database "$JOBSIFT_DATABASE" \
            --registration-file "$RUNNER_TEMP/client-sheet-registration.json" \
            > "$RUNNER_TEMP/client-sheet-registration-result.json"
          echo "Client destination registered successfully."
