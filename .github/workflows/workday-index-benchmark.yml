name: Workday Index Benchmark

on:
  push:
    branches:
      - benchmark/workday-index-run
    paths:
      - ".github/workday-index-run.json"
  workflow_dispatch:
    inputs:
      target_count:
        description: Production-approved Workday targets to index
        required: true
        default: 100
        type: number
      shard_count:
        description: Parallel Workday index shards
        required: true
        default: 10
        type: number

permissions:
  contents: read

concurrency:
  group: jobsift-workday-index-benchmark
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - name: Build Workday index plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_COUNT: ${{ github.event.inputs.target_count }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TARGET_COUNT=100
            SHARD_COUNT=10
          fi
          python -m job_scout.workday_index plan \
            --registry config/source_registries/production_active_v1.json \
            --target-count "$TARGET_COUNT" \
            --shard-count "$SHARD_COUNT" \
            --output-dir workday-index-plan

      - name: Export worker matrix
        id: matrix
        run: |
          matrix="$(python -c 'import json; print(json.dumps(json.load(open("workday-index-plan/matrix.json")), separators=(",", ":")))' )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-workday-index-plan-${{ github.run_id }}
          path: workday-index-plan/
          if-no-files-found: error
          retention-days: 3

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-workday-index-plan-${{ github.run_id }}
          path: workday-index-plan

      - name: Scan ${{ matrix.shard_id }}
        run: |
          mkdir -p workday-index-shard
          python -m job_scout.workday_index scan \
            --registry workday-index-plan/registry.json \
            --manifest workday-index-plan/manifest.json \
            --shard-id "${{ matrix.shard_id }}" \
            --output "workday-index-shard/${{ matrix.shard_id }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: jobsift-workday-index-${{ matrix.shard_id }}-${{ github.run_id }}
          path: workday-index-shard/${{ matrix.shard_id }}.json
          if-no-files-found: error
          retention-days: 3

  analyze:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
      - plan
      - scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install JobSift
        run: python -m pip install -e .

      - uses: actions/download-artifact@v4
        with:
          name: jobsift-workday-index-plan-${{ github.run_id }}
          path: workday-index-plan

      - uses: actions/download-artifact@v4
        with:
          pattern: jobsift-workday-index-workday-*-${{ github.run_id }}
          path: workday-index-artifacts
          merge-multiple: true

      - name: Validate and analyze complete index
        run: |
          mkdir -p workday-index-result
          python -m job_scout.workday_index analyze \
            --registry workday-index-plan/registry.json \
            --manifest workday-index-plan/manifest.json \
            --artifacts-dir workday-index-artifacts \
            --brief config/search_briefs/taiwo_software_remote_us_v1.json \
            --output workday-index-result/report.json

      - name: Publish Workday index evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jobsift-workday-index-result-${{ github.run_id }}
          path: workday-index-result/
          if-no-files-found: warn
          retention-days: 7
