[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-scout"
version = "0.1.0"
description = "Deterministic tailored job sourcing engine"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
job-scout = "job_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

